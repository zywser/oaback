[uwsgi]
# ===== 路径（全部绝对路径）=====
# 项目根（manage.py 所在目录）
chdir          = /www/oaback
# Django WSGI 入口（注意大小写：包目录为 OAback）
module         = OAback.wsgi:application
# 虚拟环境（uWSGI 用项目自己的 Python，否则找不到 Django/LangChain/FAISS）
venv           = /www/oaback/.venv

# ===== 与 Nginx 通信（socket + uwsgi_pass 方案）=====
socket         = /data/oa.sock
chmod-socket   = 664
# 注意①：本配置不用 http 监听，Nginx 必须配 uwsgi_pass unix:/data/oa.sock;
# 注意②：chmod-socket=664 时 socket 组外用户只有读权限，Nginx 用户必须加入 www 组：
#         usermod -a -G www nginx && systemctl restart nginx
#         （嫌麻烦可直接改成 666，但权限偏宽，不推荐）

# ===== 进程模型（按服务器核数调整；2 核示例）=====
master         = true
processes      = 2          # 进程数 ≈ CPU 核数（2~4）
threads        = 2

# ===== 稳定性 =====
# SSE 流式回答 + 工具调用可能持续 1~2 分钟，harakiri 必须大于流式时长，否则长回答会被掐断
harakiri       = 300
max-requests   = 1000       # 每 worker 处理 1000 请求后重启，防内存泄漏
reload-on-rss  = 256        # 内存超 256MB 自动重启
die-on-term    = true       # systemd 停止时优雅退出

# ===== 权限（非 root 运行）=====
uid            = www        # 服务器需存在 www 用户：useradd www（或用 nginx）
gid            = www

# ===== 日志 =====
logto          = /data/log/uwsgi.log

# ===== 退出清理 =====
vacuum         = true
