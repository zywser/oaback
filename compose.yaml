# ===== OAback 全容器化部署编排 =====
# 【放置位置】此文件放在 /www 目录（oaback 与 oafront 两个仓库的【父目录】），
#   即服务器目录结构：
#     /www/compose.yaml
#     /www/oaback     ← 后端仓库
#     /www/oafront    ← 前端仓库
# 【用法】cd /www && docker compose up -d --build
#
# 注意：后端 .env 必须用容器服务名（bridge 网络下不能用 127.0.0.1）：
#   DB_HOST=oadb
#   CELERY_BROKER_URL=redis://oaredis:6379/1
#   CELERY_RESULT_BACKEND=redis://oaredis:6379/2
#   CACHE_LOCATION=redis://oaredis:6379/3
#   AGENT_MILVUS_URI=http://oamilvus:19530   （Milvus 向量库）
#   DB_PASSWORD=123456   （与下方 MYSQL_ROOT_PASSWORD 一致）
name: oa

services:
  oaredis:
    image: "redis:7.2.5"
    container_name: "oaredis"
    restart: always
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
    volumes:
      # redis 数据持久化（容器内 /data）
      - ./volumes/oaredis:/data
    networks:
      - oa

  oadb:
    image: "mysql:8.4.0"
    container_name: "oadb"
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: zhiliaooa
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
      TZ: Asia/Shanghai
    command:
      --character-set-server=UTF8MB4
      --max_connections=1000
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p$$MYSQL_ROOT_PASSWORD"]
    volumes:
      # mysql 数据持久化
      - ./volumes/db/data:/var/lib/mysql
      - ./volumes/db/log:/var/log/mysql
    networks:
      - oa

  # ===== Milvus 向量数据库三件套（Agent RAG 向量检索后端，替换原 FAISS 本地索引）=====
  oamilvus-etcd:
    image: "quay.io/coreos/etcd:v3.5.18"
    container_name: "oamilvus-etcd"
    restart: always
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - ./volumes/etcd:/etcd
    command: etcd -advertise-client-urls=http://oamilvus-etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    networks:
      - oa

  oamilvus-minio:
    image: "minio/minio:RELEASE.2023-03-20T20-16-18Z"
    container_name: "oamilvus-minio"
    restart: always
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - ./volumes/minio:/minio_data
    command: minio server /minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - oa

  oamilvus:
    image: "milvusdb/milvus:v2.5.4"
    container_name: "oamilvus"
    restart: always
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: oamilvus-etcd:2379
      MINIO_ADDRESS: oamilvus-minio:9000
    volumes:
      - ./volumes/milvus:/var/lib/milvus
    ports:
      - "19530:19530"   # gRPC 客户端端口（后端 AGENT_MILVUS_URI=http://oamilvus:19530 走内网，无需映射，仅调试/外部访问用）
      - "9091:9091"     # 健康检查/指标端口
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9091/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
    depends_on:
      oamilvus-etcd:
        condition: service_started
      oamilvus-minio:
        condition: service_healthy
    networks:
      - oa

  oaback:
    build: ./oaback
    restart: always
    container_name: "oaback"
    # 必须：把 .env 传进容器，否则容器内无配置、连不上数据库
    env_file:
      - ./oaback/.env
    healthcheck:
      # 后端容器没有 curl，用 Python 探测；uWSGI 需同时监听 http :8000（见 uwsgi.docker.ini）
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/api/home/health', timeout=5).status==200 else 1)"]
    depends_on:
      oaredis:
        condition: service_healthy
      oadb:
        condition: service_healthy
      oamilvus:
        condition: service_healthy
    volumes:
      - ./volumes/sock:/data/sock              # uWSGI socket，供 nginx 容器反代
      - ./volumes/static:/www/staticfiles      # collectstatic 产物，nginx 容器共享
      - ./volumes/media:/www/media             # 用户上传文件，nginx 容器共享
    networks:
      - oa

  oafront:
    build: ./oafront
    container_name: "oafront"
    restart: always
    ports:
      - "80:80"
    healthcheck:
      # nginx 镜像没有 curl，用 nginx -t 做存活探测
      test: ["CMD", "nginx", "-t"]
    depends_on:
      - oaback
    volumes:
      - ./volumes/sock:/data/sock
      - ./volumes/static:/www/staticfiles
      - ./volumes/media:/www/media
      - ./volumes/oafront/log:/data/log
    networks:
      - oa

networks:
  oa:
    driver: "bridge"
