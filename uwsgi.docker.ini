[uwsgi]
# ===== 容器版配置（Docker 部署专用；裸机部署请用项目根的 uwsgi.ini）=====
# 容器内项目位于 /www（Dockerfile 中 COPY . /www/）
chdir          = /www
module         = OAback.wsgi:application

# 与前端 nginx 容器共享的 socket（docker compose 中两个容器都挂载 /data/sock 卷）
socket         = /data/sock/oa.sock
chmod-socket   = 666
# 额外监听 http 8000：仅用于容器内 healthcheck（未映射端口，外部不可达）
http           = :8000

master         = true
processes      = 2
threads        = 2

# SSE 流式回答 + 工具调用可能持续 1~2 分钟，harakiri 必须大于流式时长
harakiri       = 300
max-requests   = 1000
reload-on-rss  = 256
die-on-term    = true

# 容器内以 root 运行，不设 uid/gid
logto          = /data/log/uwsgi.log
vacuum         = true
